plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.navblerelay"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.navblerelay"
        minSdk = 21
        targetSdk = 35
        versionCode = 4
        versionName = "0.4.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // 显式关闭资源压缩，避免 Flutter 自动升级 build.gradle 时
            // 启用 shrinkResources 但 minifyEnabled=false 引发的配置错误
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
