plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin 从 settings.gradle 的 includeBuild 加载
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.navblerelay"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.navblerelay"
        minSdk = 21
        targetSdk = 35
        versionCode = 4
        versionName = "0.4.0"
    }

    buildTypes {
        release {
            // Flutter 调试符号，CI 中使用 debug 签名即可
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}
