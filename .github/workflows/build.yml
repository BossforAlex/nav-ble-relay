name: Build ESP32 Firmware

on:
  push:
    branches:
      - main
      - trae/solo-agent-*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: Auto

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - esp32-c3-supermini
          - esp32dev
          - esp32-s3-devkitc-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            Auto/.pio
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('Auto/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (${{ matrix.environment }})
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: Auto/.pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./firmware

      - name: Rename artifacts for release
        working-directory: .
        run: |
          mkdir -p release
          cp firmware/firmware-esp32-c3-supermini/firmware.bin release/firmware-esp32-c3-supermini.bin
          cp firmware/firmware-esp32dev/firmware.bin release/firmware-esp32dev.bin
          cp firmware/firmware-esp32-s3-devkitc-1/firmware.bin release/firmware-esp32-s3-devkitc-1.bin
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release/*.bin
          generate_release_notes: true
