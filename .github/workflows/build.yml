name: Build Firmware & Android App

on:
  push:
    branches:
      - main
      - trae/solo-agent-*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build ESP32-C3 Super Mini Firmware
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            Auto/.pio
          key: ${{ runner.os }}-pio-v3-esp32-c3-supermini-${{ hashFiles('Auto/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (esp32-c3-supermini)
        run: |
          set -x
          python3 -m platformio system info
          rm -rf .pio/build
          python3 -m platformio run -e esp32-c3-supermini

      - name: Create factory firmware image
        run: |
          pip install esptool
          # ESP32-C3 内存布局（与经典 ESP32 不同）：
          #   0x0000  bootloader.bin   （第二阶段引导程序）
          #   0x8000  partitions.bin   （分区表）
          #   0x10000 firmware.bin     （应用程序）
          esptool.py --chip esp32c3 merge-bin \
            -o firmware-merged.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x0000 .pio/build/esp32-c3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-c3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-c3-supermini/firmware.bin
          echo "=== Merged firmware info ==="
          ls -la firmware-merged.bin
          # 验证固件前几个字节：应包含 ESP32-C3 的合法 bootloader 头
          xxd firmware-merged.bin | head -n 4
          # 验证 bootloader 镜像头：
          #   第 2 字节为 SPI 模式字段：DIO=0x02，QIO=0x00
          #   第 3 字节高 4 位为 Flash 容量：0x20=4MB；低 4 位为 Flash 频率：0x00=40MHz
          python3 -c "
          import sys
          with open('firmware-merged.bin', 'rb') as f:
              header = f.read(8)
          print('Header bytes:', header.hex())
          spi_mode = header[2]
          flash_byte = header[3]
          flash_size = flash_byte >> 4
          flash_freq = flash_byte & 0x0f
          mode_name = {0x00:'QIO', 0x01:'QOUT', 0x02:'DIO', 0x03:'DOUT'}.get(spi_mode, 'UNKNOWN')
          size_name = {0x00:'1MB', 0x01:'2MB', 0x02:'4MB', 0x03:'8MB', 0x04:'16MB'}.get(flash_size, 'UNKNOWN')
          freq_name = {0x00:'40MHz', 0x01:'26MHz', 0x02:'20MHz', 0x0f:'80MHz'}.get(flash_freq, 'UNKNOWN')
          print(f'SPI mode field: 0x{spi_mode:02x} ({mode_name})')
          print(f'Flash size field: 0x{flash_size:02x} ({size_name})')
          print(f'Flash freq field: 0x{flash_freq:02x} ({freq_name})')
          if spi_mode != 0x02:
              print('ERROR: bootloader is not DIO mode', file=sys.stderr)
              sys.exit(1)
          if flash_size != 0x02:
              print('ERROR: flash size is not 4MB', file=sys.stderr)
              sys.exit(1)
          if flash_freq != 0x00:
              print('ERROR: flash frequency is not 40MHz', file=sys.stderr)
              sys.exit(1)
          print('OK: bootloader header uses DIO + 4MB + 40MHz')
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: Auto/firmware-merged.bin
          if-no-files-found: error

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-firmware, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: ./firmware

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: ./apk

      - name: Rename artifacts for release
        working-directory: .
        run: |
          mkdir -p release
          cp firmware/firmware-merged.bin release/firmware-esp32-c3-supermini.bin
          cp apk/app-debug.apk release/app-debug.apk
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
