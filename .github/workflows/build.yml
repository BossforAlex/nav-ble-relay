name: Build Firmware & Android App

on:
  push:
    branches:
      - main
      - trae/solo-agent-*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build ESP32-C3 Super Mini Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            Auto/.pio
          key: ${{ runner.os }}-platformio-esp32-c3-supermini-${{ hashFiles('Auto/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (esp32-c3-supermini)
        run: |
          pio system info
          # 清理旧构建产物，避免缓存污染导致编译秒退
          rm -rf .pio/build
          pio run -e esp32-c3-supermini

      - name: Create factory firmware image
        run: |
          pip install esptool
          # ESP32-C3 内存布局（与经典 ESP32 不同）：
          #   0x0000  bootloader.bin   （第二阶段引导程序）
          #   0x8000  partitions.bin   （分区表）
          #   0x10000 firmware.bin     （应用程序）
          esptool.py --chip esp32c3 merge_bin \
            -o firmware-merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x0000 .pio/build/esp32-c3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-c3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-c3-supermini/firmware.bin
          echo "=== Merged firmware info ==="
          ls -la firmware-merged.bin
          # 验证固件前几个字节：应包含 ESP32-C3 的合法 bootloader 头
          xxd firmware-merged.bin | head -n 4

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: Auto/firmware-merged.bin
          if-no-files-found: error

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-firmware, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: ./firmware

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: ./apk

      - name: Rename artifacts for release
        working-directory: .
        run: |
          mkdir -p release
          cp firmware/firmware-merged.bin release/firmware-esp32-c3-supermini.bin
          cp apk/app-debug.apk release/app-debug.apk
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
