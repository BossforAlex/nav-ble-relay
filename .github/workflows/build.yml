name: Build Firmware & Flutter App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            Auto/.pio
          key: ${{ runner.os }}-pio-v4-esp32-s3-${{ hashFiles('Auto/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Verify fonts are up-to-date
        run: |
          if [ ! -f src/ui/fonts/cjk_20.c ]; then
            echo "::error::Font files not found! Run: bash scripts/generate_fonts.sh"
            exit 1
          fi
          echo "Font files: $(ls -la src/ui/fonts/*.c 2>/dev/null | wc -l) generated"

      - name: Build ESP32-S3 firmware (with TFT screen)
        run: |
          set -x
          python3 -m platformio system info
          rm -rf .pio/build
          python3 -m platformio run -e esp32-s3-supermini

      - name: Build ESP32-C3 firmware (serial-only fallback)
        run: |
          python3 -m platformio run -e esp32-c3-supermini

      - name: Create factory firmware images
        run: |
          # ESP32-S3 内存布局：
          #   0x0000  bootloader.bin
          #   0x8000  partitions.bin
          #   0x10000 firmware.bin
          esptool.py --chip esp32s3 merge-bin \
            -o firmware-s3-merged.bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 4MB \
            0x0000 .pio/build/esp32-s3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-s3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-s3-supermini/firmware.bin

          # ESP32-C3 内存布局：
          esptool.py --chip esp32c3 merge-bin \
            -o firmware-c3-merged.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x0000 .pio/build/esp32-c3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-c3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-c3-supermini/firmware.bin

          echo "=== S3 Merged firmware ==="
          ls -la firmware-s3-merged.bin
          xxd firmware-s3-merged.bin | head -n 4

          echo "=== C3 Merged firmware ==="
          ls -la firmware-c3-merged.bin

      - name: Validate firmware headers
        run: |
          python3 -c "
          import sys
          # 期望值：与 platformio.ini 中 board_build.flash_size / f_flash 必须保持一致。
          # 任何修改 platformio.ini 中 flash 配置的人必须同步更新这里，CI 会强制校验。
          # ESP32 image header byte[3] 格式：
          #   高 4 bit = flash size ID, 低 4 bit = flash freq ID
          # size ID（来自 esptool.py ESP_IMAGE_FLASH_SIZES）：
          #   0x00=1MB, 0x01=2MB, 0x02=4MB, 0x03=8MB, 0x04=16MB, 0x05=32MB
          # freq ID: 0x00=40MHz, 0x01=26MHz, 0x02=20MHz, 0x0F=80MHz
          expected = {
              'S3': {'mode': 0x02, 'size_id': 0x02, 'size_name': '4MB', 'freq_id': 0x0F, 'freq_name': '80MHz'},
              'C3': {'mode': 0x02, 'size_id': 0x02, 'size_name': '4MB', 'freq_id': 0x00, 'freq_name': '40MHz'},
          }
          size_map = {0x00:'1MB', 0x01:'2MB', 0x02:'4MB', 0x03:'8MB', 0x04:'16MB', 0x05:'32MB'}
          freq_map = {0x00:'40MHz', 0x01:'26MHz', 0x02:'20MHz', 0x0F:'80MHz'}
          mode_map = {0x00:'QIO', 0x02:'DIO', 0x03:'DOUT'}
          ok = True
          for name, chip in [('firmware-s3-merged.bin', 'S3'), ('firmware-c3-merged.bin', 'C3')]:
              with open(name, 'rb') as f:
                  header = f.read(8)
              exp = expected[chip]
              spi_mode = header[2]
              flash_byte = header[3]
              size_id = flash_byte >> 4
              freq_id = flash_byte & 0x0f
              print(f'=== {chip} header: {header.hex()} ===')
              print(f'  SPI mode    : 0x{spi_mode:02x} ({mode_map.get(spi_mode, \"UNKNOWN\")})  expect 0x{exp[\"mode\"]:02x} (DIO)')
              print(f'  Flash size  : 0x{size_id:x} ({size_map.get(size_id, \"UNKNOWN\")})  expect 0x{exp[\"size_id\"]:x} ({exp[\"size_name\"]})')
              print(f'  Flash freq  : 0x{freq_id:x} ({freq_map.get(freq_id, \"UNKNOWN\")})  expect 0x{exp[\"freq_id\"]:x} ({exp[\"freq_name\"]})')
              if spi_mode != exp['mode']:
                  print(f'  ERROR: {chip} SPI mode mismatch', file=sys.stderr); ok = False
              if size_id != exp['size_id']:
                  print(f'  ERROR: {chip} flash size mismatch (image header declares {size_map.get(size_id)} but expected {exp[\"size_name\"]})', file=sys.stderr)
                  print(f'         这通常是因为 platformio.ini 中 board_build.flash_size 与板子实际 Flash 不一致。', file=sys.stderr)
                  print(f'         ESP32-S3 Super Mini 实测为 4MB Flash（ESP32-S3FH4R2），不应配置为 8MB。', file=sys.stderr)
                  ok = False
              if freq_id != exp['freq_id']:
                  print(f'  ERROR: {chip} flash freq mismatch', file=sys.stderr); ok = False
          if not ok:
              sys.exit(1)
          print('=== OK: all firmware headers match expected flash config ===')
          "

      - name: Upload S3 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3-supermini
          path: Auto/firmware-s3-merged.bin
          if-no-files-found: error

      - name: Upload C3 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: Auto/firmware-c3-merged.bin
          if-no-files-found: error

  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: app_flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-flutter-release
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-firmware, build-flutter]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-s3-supermini
          path: ./firmware-s3

      - name: Download C3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-c3-supermini
          path: ./firmware-c3

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-flutter-release
          path: ./apk

      - name: Rename artifacts for release
        run: |
          mkdir -p release
          cp firmware-s3/firmware-s3-merged.bin release/firmware-esp32-s3-supermini.bin
          cp firmware-c3/firmware-c3-merged.bin release/firmware-esp32-c3-supermini.bin
          cp apk/app-release.apk release/app-flutter-release.apk
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            ### 固件
            - `firmware-esp32-s3-supermini.bin` — ESP32-S3 Super Mini + ST7789 TFT 屏幕（推荐）
            - `firmware-esp32-c3-supermini.bin` — ESP32-C3 Super Mini 串口版（向后兼容）

            ### APP
            - `app-flutter-release.apk` — Flutter 版 Android APP（Material 3 + 动态主题）

            ### 刷写方法
            ```bash
            # ESP32-S3
            esptool.py --chip esp32s3 --port COMx erase_flash
            esptool.py --chip esp32s3 --port COMx write_flash -z \
              --flash-mode dio --flash-freq 80m --flash-size 4MB \
              0x0 firmware-esp32-s3-supermini.bin

            # ESP32-C3
            esptool.py --chip esp32c3 --port COMx erase_flash
            esptool.py --chip esp32c3 --port COMx write_flash -z \
              --flash-mode dio --flash-freq 40m --flash-size 4MB \
              0x0 firmware-esp32-c3-supermini.bin
            ```
          files: release/*
          generate_release_notes: true
