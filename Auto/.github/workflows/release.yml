name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ══════════════════════════════════════════════════════════════
  # 编译 ESP32-S3 SuperMini (ILI9341 TFT + LVGL)
  # ══════════════════════════════════════════════════════════════
  build-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-s3-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32-s3-supermini

      - name: Rename firmware
        run: |
          mkdir -p release
          cp .pio/build/esp32-s3-supermini/firmware.bin release/nav-ble-relay-s3-v${{ github.ref_name }}.bin
          # 同时保留一个不带版本号的文件名，方便 OTA
          cp .pio/build/esp32-s3-supermini/firmware.bin release/nav-ble-relay-s3-latest.bin

      - name: Upload S3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3
          path: release/

  # ══════════════════════════════════════════════════════════════
  # 编译 ESP32-C3 SuperMini (串口直通，无屏幕)
  # ══════════════════════════════════════════════════════════════
  build-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-c3-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ESP32-C3 firmware
        run: pio run -e esp32-c3-supermini

      - name: Rename firmware
        run: |
          mkdir -p release
          cp .pio/build/esp32-c3-supermini/firmware.bin release/nav-ble-relay-c3-v${{ github.ref_name }}.bin
          cp .pio/build/esp32-c3-supermini/firmware.bin release/nav-ble-relay-c3-latest.bin

      - name: Upload C3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3
          path: release/

  # ══════════════════════════════════════════════════════════════
  # 发布 Release（仅 tag push 触发）
  # ══════════════════════════════════════════════════════════════
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-s3, build-c3]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-s3
          path: release/

      - name: Download C3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-c3
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }} 固件

            | 平台 | 固件文件 |
            |------|----------|
            | ESP32-S3 SuperMini (ILI9341 TFT) | `nav-ble-relay-s3-${{ github.ref_name }}.bin` |
            | ESP32-C3 SuperMini (串口直通) | `nav-ble-relay-c3-${{ github.ref_name }}.bin` |

            ### 烧录方法
            - **ESP32-S3**: `esptool.py --port COMx write_flash 0x0 nav-ble-relay-s3-${{ github.ref_name }}.bin`
            - **ESP32-C3**: `esptool.py --port COMx write_flash 0x0 nav-ble-relay-c3-${{ github.ref_name }}.bin`
          files: |
            release/*.bin
          draft: false
          prerelease: false
          generate_release_notes: true