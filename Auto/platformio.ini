; ============================================================
; AutoNavDisplay - ESP32 导航信息接收与显示项目
; 目标硬件：ESP32-S3 Super Mini（升级自 ESP32-C3 Super Mini）
; 屏幕：ST7789 SPI TFT（240x240 / 170x320 等自适应）
; ============================================================

[platformio]
description = ESP32-S3 Super Mini 导航信息接收与显示项目
src_dir = src

; ============================================================
; 公共配置：所有环境共享的编译/依赖/调试参数
; ============================================================
[common]
framework = arduino
monitor_speed = 115200
monitor_filters =
    default

; 关键：忽略 ESP32 Arduino 内置 BLE 库，避免与 NimBLE-Arduino 冲突
; （内置库用 NimBLE 但不暴露安全配置 setter）
lib_ignore = BLE

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; NimBLE-Arduino 替代 ESP32 Arduino 内置 BLE 库
    ; 原因：ESP32 Arduino BLE 2.0+ 不暴露 NimBLE 的安全配置 API（setSecurityAuth 等），
    ;       导致默认 LESC 配对无法关闭，手机写入会被加密协商阻塞。
    ;       NimBLE-Arduino 1.4+ 提供 BLEDevice 兼容 API + 完整 setter。
    h2zero/NimBLE-Arduino @ ^1.4.1
    ; TFT 屏幕驱动（ST7789 等 SPI TFT）
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D SERIAL_BAUD=115200
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    ; 禁用 ESP32 Arduino 内置 BLE 库（避免 NimBLE-Arduino 冲突）
    -D CONFIG_BT_BLE_ENABLED=1
    ; 增大 NimBLE 协议栈任务栈大小（默认 4096 → 8192 仍不够）
    ; 500+ 字节 JSON 写入 + indicate 处理同时发生时栈溢出 → Stack canary + IWDT
    -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=16384
    ; 编译期限制 NimBLE 协议栈自身日志级别为 ERROR，防止 subscribe/mtu spam
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; 增大 Arduino 主 loop 任务栈（默认 8192，indicate 阻塞 + JSON 解析可能不够）
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; ============================================================
; 环境 1：ESP32-S3 Super Mini（主力环境）
; 说明：S3 Super Mini 性能远超 C3，双核 240MHz + 更多 RAM，
;       适合驱动 SPI TFT 屏幕并运行 HUD 风格 UI。
;       常见 clone 板使用 DIO + 40MHz 提高兼容性。
; ============================================================
[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D BOARD_NAME=\"ESP32-S3-SuperMini\"
    ; 用户态 CDC USB 串口（S3 原生 USB）
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; 屏幕模式：默认串口直通（安全），连接 TFT 后改为 0
    ; v0.6.0: 启用 ILI9341 TFT 横屏显示
    -D SCREEN_SERIAL_ONLY=0
    ; TFT_eSPI 配置：ILI9341 + SPI（MSP2807 2.8寸屏）
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    ; ESP32-S3: MOSI=11/SCK=12/CS=10 属于 HSPI (SPI3) 总线
    ; 必须指定 USE_HSPI_PORT，否则 TFT_eSPI 默认用 FSPI (SPI2)
    ; FSPI 默认引脚是 MOSI=35/SCK=36，SPI 信号发不到屏幕
    -D USE_HSPI_PORT
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=6
    -D SPI_FREQUENCY=27000000
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; v0.6.2: 不使用 PSRAM，直接绘制到 TFT 避免 sprite 帧缓冲
    ; 兼容 PSRAM 不稳定或无 PSRAM 的 ESP32-S3 克隆板
    ; SPI频率从 40MHz 降至 27MHz 提高兼容性
    ; S3 支持 80MHz Flash，DIO 模式提高 clone 板兼容性
    ; 实测 ESP32-S3 Super Mini clone 板载 Flash 为 4MB（ESP32-S3FH4R2），
    ; image header 中的 flash size 必须与板子实际容量一致，否则
    ; bootloader 在 do_core_init 阶段会触发 assert 并 boot loop：
    ;   "Detected size(4096k) smaller than the size in the binary image header(8192k)"
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.partitions = default.csv

; ============================================================
; 环境 2：ESP32-C3 Super Mini（向后兼容，仅串口虚拟屏幕）
; ============================================================
[env:esp32-c3-supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_ignore = ${common.lib_ignore}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D BOARD_NAME=\"ESP32-C3-SuperMini\"
    -D SCREEN_SERIAL_ONLY=1
; C3 无 TFT 屏幕，排除 TFT 驱动源文件避免编译错误
; 注意：build_src_filter 会覆盖默认的 +<*>，必须显式声明包含规则
; 路径相对 src_dir（即 Auto/src/），所以是 screen/ 不是 src/screen/
build_src_filter = +<*> -<screen/ScreenTFT.*>
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 4MB
