; ============================================================
; AutoNavDisplay - ESP32 导航信息接收与显示项目
; 目标硬件：ESP32-C3 Super Mini（可移植到其他 ESP32 平台）
; ============================================================

[platformio]
description = ESP32-C3 Super Mini 导航信息接收与显示项目
src_dir = src

; ============================================================
; 公共配置：所有环境共享的编译/依赖/调试参数
; ============================================================
[common]
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    ; 如需要彩色输出可启用：
    ; colorize

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D SERIAL_BAUD=115200
    ; 统一使用 std::function，避免不同 core 版本差异
    -D ARDUINOJSON_ENABLE_STD_STRING=1

; ============================================================
; 环境 1：ESP32-C3 Super Mini
; 说明：C3 Super Mini 常见 clone 板大多兼容 esp32-c3-devkitm-1；
;       若你使用的是 Lolin C3 Mini 等特定板型，把 board 改为 lolin_c3_mini。
; ============================================================
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D BOARD_NAME=\"ESP32-C3-SuperMini\"
; C3 Super Mini 常见 clone 板 Flash 质量/走线一般，使用 DIO + 40MHz 提高刷写和启动兼容性
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 4MB
; 强制 bootloader 也使用 DIO 模式，避免启动阶段因 QIO 导致看门狗复位
board_build.bootloader = dio

; ============================================================
; 环境 2：经典 ESP32 DevKit（方便移植测试）
; 用法：pio run -e esp32dev
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D BOARD_NAME=\"ESP32-DevKit\"

; ============================================================
; 环境 3：ESP32-S3（后续高性能屏幕方案预留）
; ============================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D BOARD_NAME=\"ESP32-S3-DevKitC-1\"
